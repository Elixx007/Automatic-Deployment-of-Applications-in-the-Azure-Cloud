name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Build Docker image
        run: |
          docker build -t my-app:latest ./docker
      
      - name: Run tests
        run: |
          echo "Running tests..."
      
      - name: Deploy to Azure
        run: |
          echo "Deploying to Azure..."